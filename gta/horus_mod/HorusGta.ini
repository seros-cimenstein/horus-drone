; HORUS GTA renderer mod (gta/horus_mod/README.md). Lives next to HorusGta.dll in the game's scripts folder.

[pose]
; UDP endpoint for horus-gta-bridge pose packets.
bind=127.0.0.1
port=5611
; Hand the screen back to the game after this many seconds without a valid pose. The release
; happens on a script tick, up to two ticks (30-40 ms each) later; 1.9 keeps it within 2 s.
timeout_s=1.9

[origin]
; GTA world position (metres) of SITL home: Legion Square, Los Santos.
x=195
y=-933
; GTA heading of NED north, counter-clockwise from GTA +Y (0: SITL north is GTA north).
heading_deg=0
; GTA height of SITL home. Leave empty to use the ground height probed at x, y.
z=

[scene]
; Applied when the drone camera activates and undone on release. Empty = leave the game's own.
; Weather type (EXTRASUNNY, CLEAR, CLOUDS, OVERCAST, RAIN, FOGGY, ...).
weather=
; Clock hour 0..23.
hour=
; Stop the game clock while the camera is active.
freeze_time=false

[physics]
; ArduPilot SITL's JSON backend (sim/run.sh start --gta --json-physics) sends servo frames here;
; HorusGta flies the quad and answers with its state. Its frames take over from [pose] packets.
bind=127.0.0.1
port=9002
; Wall-clock milliseconds per script tick spent answering SITL (the game frame waits meanwhile).
budget_ms=10
; Drone camera horizontal FOV, as executor.camera_horizontal_fov_deg in config/horus_gta.yaml.
hfov_deg=84
; Write scripts/HorusGtaTrace.csv: this many rows per second of the drone camera and airframe pose
; read back from the game, with the physics state (README "Physics"). 0 = off.
trace_hz=0

[sensors]
; Seven short-range distance sensors as on the HORUS Gazebo drone (front, front_right, right, rear,
; left, front_left, down; 4 m), swept while the [physics] link flies the quad. Each sweep is one
; 44-byte "HRNG" UDP datagram; HORUS forwards it to ArduPilot as DISTANCE_SENSOR (README
; "Range sensors"). 1 = on, 0 = cast and send nothing.
enabled=1
; UDP destination host:port (IPv4) of the range datagrams.
target=127.0.0.1:5612
; Sweeps per second of physics simulation time, 10..20.
rate_hz=20

[view]
; drone: the drone camera is on screen while it flies and the player is held (frozen, invincible,
; no wanted level). shared: the player keeps his camera, HUD and control; the drone camera renders
; one script tick in drone_every and horus_capture.asi gives HORUS only those frames, keeping them
; off the screen (README "Shared view"). An 8x8 px marker is drawn in the top-left corner.
mode=drone
; Shared view: one drone tick every this many ticks, 2..4 (2: the player sees half the frame rate).
drone_every=2
