[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horus-drone"
version = "0.1.0"
description = "Safety-first, latency-tolerant autonomous drone supervision core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "mcp>=1.30.0,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.29,<1",
  "pymavlink>=2.4.41,<3",
  "numpy>=1.24,<3",
  "onnxruntime>=1.17,<2",
  "opencv-contrib-python-headless>=4.10,<5",
  "mujoco>=3.2,<4",
  "platformdirs>=4.2,<5",
  "pyserial>=3.5,<4",
  "anthropic>=0.34,<1",
  "openai>=1.30,<3",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
# Lean companion-computer install (Phase 4): no MuJoCo, no cloud LLM SDKs, no opencv-headless shadow.
board = [
  "PyYAML>=6.0,<7",
  "mcp>=1.30.0,<2",
  "uvicorn>=0.29,<1",
  "pymavlink>=2.4.41,<3",
  "numpy>=1.24,<3",
  "onnxruntime>=1.17,<2",
  "pyserial>=3.5,<4",
  "rich>=13.7,<15",
]
commander = [
  "mcp>=1.30.0,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.29,<1",
  "rich>=13.7,<15",
]
server = [
  "horus-drone[commander]",
  "pymavlink>=2.4.41,<3",
]
perception = [
  "numpy>=1.24,<3",
  "onnxruntime>=1.17,<2",
]
model-tools = ["onnx>=1.16,<2"]
opencv-headless = ["opencv-contrib-python-headless>=4.10,<5"]
grounder = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "scipy==1.10.1",
  "Pillow==10.4.0",
]
commander-anthropic = ["anthropic>=0.34,<1"]
commander-openai = ["openai>=1.30,<3"]
test = [
  "pytest>=8,<9",
  "horus-drone[commander]",
  "numpy>=1.24,<3",
  "rich>=13.7,<15",
]

[project.scripts]
horus = "horus.cli:main"
horus-mcp = "horus.mcp_server.server:main"
horus-mcp-call = "horus.mcp_server.client:main"
horus-commander-serve = "horus.commander.server:main"
horus-gz-gimbal = "horus.gimbal.gazebo:main"
horus-gta-gimbal = "horus.gimbal.gta:main"
horus-tof-bridge = "horus.tof_bridge.cli:main"
horus-grounder = "horus.grounder.server:main"

[tool.setuptools.packages.find]
include = ["horus*"]

[tool.setuptools.package-data]
"horus.commander" = ["web/*", "web/scenes/*"]
"horus.world" = ["data/*", "data/ardupilot/*", "scenes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
