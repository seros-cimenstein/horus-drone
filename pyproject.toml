[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horus-drone"
version = "0.1.0"
description = "Safety-first, latency-tolerant autonomous drone supervision core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
commander = [
  "mcp>=1.30.0,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.29,<1",
]
server = [
  "horus-drone[commander]",
  "pymavlink>=2.4.41,<3",
]
perception = [
  "numpy>=1.24,<2",
  "onnxruntime>=1.17,<2",
]

model-tools = ["onnx>=1.16,<2"]
opencv-headless = ["opencv-contrib-python-headless>=4.8,<4.12"]
grounder = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "scipy==1.10.1",
  "Pillow==10.4.0",
]
commander-anthropic = ["anthropic>=0.34,<1"]
commander-openai = ["openai>=1.30,<3"]
test = [
  "pytest>=8,<9",
  "horus-drone[commander]",
  "numpy>=1.24,<2",
]

[project.scripts]
horus = "horus.repl.app:main"
horus-mcp = "horus.mcp_server.server:main"
horus-mcp-call = "horus.mcp_server.client:main"
horus-commander-serve = "horus.commander.server:main"
horus-gz-bridge = "horus.gz_bridge:main"
horus-tof-bridge = "horus.tof_bridge.cli:main"
horus-grounder = "horus.grounder.server:main"

[tool.setuptools.packages.find]
include = ["horus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
