# Indoor room-and-corridor profile. Only non-default settings are listed; horus/config.py holds
# the defaults and documents each executor field.
gimbal:
  # The simulated gimbal device (horus-gz-gimbal) sends to this port; HORUS drives it directly,
  # not through ArduPilot.
  connection: udpin:127.0.0.1:14600
perception:
  # Frames are kept by wall time. The commander often thinks 10-25 s between get_frame and point,
  # so keep 30 s (~140 MB at 5 fps, 640x480); tracker retention stays capped at 10 s.
  ring_buffer_s: 30.0
  # Normalized [x1, y1, x2, y2] camera boxes for the propellers; ignore detections ≥50% covered.
  ignore_regions:
    - [0.0, 0.0, 0.22, 0.24]
    - [0.65, 0.0, 1.0, 0.24]
commander:
  timeout_s: 900.0
  # Branch `chinkmaxxing`: every model in the commander and its crew runs DeepSeek 4.1 Flash at max
  # thinking through omp (oh-my-pi), using the user's existing omp login and no API key.
  provider: omp
  omp_model: opencode-go/deepseek-v4.1-flash
  omp_thinking: max
