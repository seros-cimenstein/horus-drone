flight:
  connection: tcp:127.0.0.1:5760
  baud: 115200
  heartbeat_timeout_s: 30.0
  source_system: 255
  source_component: 190
  gps_free_mode: false
  global_origin_latitude_deg: -35.363262
  global_origin_longitude_deg: 149.165237
  global_origin_altitude_m: 584.0
executor:
  control_hz: 15.0
  command_ttl_s: 30.0
  max_speed_m_s: 1.0
  max_vertical_speed_m_s: 0.5
  max_distance_m: 8.0
  min_altitude_m: 0.5
  # Indoor walls are 2.5 m high (RTL_ALT_M 2 in config/ardupilot/horus_sitl.parm); keep the
  # airframe below them rather than the 5 m outdoor envelope.
  max_altitude_m: 2.2
  geofence_radius_m: 8.0
  # Vertices are [north_m, east_m] = [Gazebo y, Gazebo x] for the room and corridor.
  geofence_polygon_ned:
    - [-4.0, -5.0]
    - [-4.0, 5.0]
    - [4.0, 5.0]
    - [4.0, 1.4]
    - [8.0, 1.4]
    - [8.0, -1.4]
    - [4.0, -1.4]
    - [4.0, -5.0]
  # Polygon edges are wall centre lines (walls are 0.2 m thick). ArduPilot proximity avoidance
  # holds AVOID_MARGIN 1.0 m (config/ardupilot/*.parm) from wall faces, so the inset is
  # 0.1 m half wall + 1.0 m + 0.1 m slack; a smaller inset makes edge targets unreachable.
  geofence_margin_m: 1.2
  arrival_tolerance_m: 0.25
  follow_distance_m: 2.0
  target_width_m: null
  # Monocular range from box height, person targets only (person label, shirt-colour attribute,
  # or a person label remembered for the track). The simulated people (MakeHuman mesh) are 1.90 m
  # tall; real deployments should use the expected person height (~1.7 m).
  target_height_m: 1.9
  target_match_threshold: 0.72
  camera_horizontal_fov_deg: 114.59155902616465
  default_gimbal_pitch_deg: 0.0
  link_loss_rth_delay_s: 30.0
  # Wall-clock freshness limit for pose/heading/range/frame samples that drive motion; the flight
  # link requests the control messages at 20 Hz autopilot time so this holds at low sim RTF.
  telemetry_max_age_s: 1.5
  # Precision landing owns the descent in GUIDED; if altitude stalls below this rate for this
  # long (autopilot prec-land failsafe, lost tag), hand back to LAND instead of hovering armed.
  precision_landing_stall_s: 12.0
  precision_landing_min_descent_m_s: 0.05
  # A tag that is only detected every few frames must not pulse the setpoint to zero: the last
  # validated centring/descent setpoint stays active this long after the last detection.
  precision_landing_target_grace_s: 1.0
perception:
  enabled: true
  point_compensation_enabled: true
  source: udp://0.0.0.0:5600
  detector_model: models/yolov8n.onnx
  embedding_model: models/osnet_x0_25_msmt17.onnx
  grounder_url: http://127.0.0.1:8100
  max_fps: 5.0
  open_vocab_hz: 0.5
  vocabulary: []
  onnx_intra_op_num_threads: 2
  onnx_inter_op_num_threads: 1
  # Frames are kept by wall time. The commander often thinks 10-25 s between get_frame and point,
  # so keep 30 s (~140 MB at 5 fps, 640x480); tracker retention stays capped at 10 s.
  ring_buffer_s: 30.0
  render_width_px: 640
  # Keep a live track's identity through a marginal appearance-score dip (see the tracker): the
  # revalidation threshold itself is never lowered, and re-acquisition gets no grace.
  revalidation_grace_s: 1.0
  # Normalized [x1, y1, x2, y2] camera boxes for the propellers; ignore detections ≥50% covered.
  ignore_regions:
    - [0.0, 0.0, 0.22, 0.24]
    - [0.65, 0.0, 1.0, 0.24]
server:
  host: 127.0.0.1
  port: 8000
  auth_token_env: HORUS_MCP_TOKEN
commander:
  provider: claude-code
  model: claude-3-5-sonnet-latest
  base_url: null
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 800
  timeout_s: 900.0
  # Claude's agentic tool-call budget applies to each stream-json turn, not the whole mission.
  max_turns: 40
  claude_command: claude
  # Claude Code commander: 'opus' tracks the newest Opus model the account can use.
  claude_model: opus
  claude_effort: high
