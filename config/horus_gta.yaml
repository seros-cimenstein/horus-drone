# GTA V renderer mode (sim/run.sh start --gta [--json-physics], gta/horus_mod/README.md): GTA V
# draws the camera view at HorusGta.ini's origin (Legion Square, GTA x=195, y=-933). With
# --json-physics the quad flies in GTA and collides with it; without, SITL flies over its own flat
# plane and the camera passes through walls. As config/horus_urban.yaml except the source;
# ArduPilot's fence is config/ardupilot/gta.parm.
gimbal:
  # Simulated gimbal device; see config/horus.yaml.
  connection: udpin:127.0.0.1:14600
executor:
  speed_m_s: 3.0
  vertical_speed_m_s: 1.5
  # Obstacles are left to the emulated ToF payload (--json-physics: HorusGta.dll casts the seven
  # beams into the game, sim/scripts/start_gta_sitl.sh) and ArduPilot's proximity avoidance, which
  # stops guided velocity 1 m (AVOID_MARGIN) before what a beam sees within 4 m. ArduPilot's fence
  # (config/ardupilot/gta.parm) is the operating area: 40 m around home, the plaza and its edges,
  # a 48 m ceiling and a 6 m floor once the vehicle has climbed above it, because the plane sweeps
  # below found the air clear from 6 m up while the kiosk roof (4.4 m) and unmapped low objects
  # stand below. The beams are level and 45 deg apart, so they miss what is above or below the
  # drone and a thin pole between two beams; the mapped obstacles below include such cases (the
  # colonnade's overhanging slabs, tree canopies).
  # Obstacles mapped in GTA (NED m from home, heights above home ground):
  #   - the grey colonnade structure at the square's NE: horizontal slabs at 4, 16, 22-24 and
  #     29-30 m over north 0..17, east 13..24+;
  #   - trees along north -20 at east 8..16, tops 18-21 m;
  #   - 5 m walls at (18, 16), (20, 14), (24, 8); a 4.4 m kiosk roof at (0, -12).
  # Vertical sweeps every 4 m from 60 m down to 2 m over north -15..20, east -20..8 found only the
  # kiosk there, and plane sweeps at 6, 8, 10 and 12 m above home over north -16..20, east -20..10
  # crossed nothing; below 6 m stand the kiosk and unmapped low objects (planters, benches, lamps).
  arrival_tolerance_m: 0.4
  # horus-gta-bridge sends this value to HorusGta.dll as the camera's horizontal FOV, so the
  # rendered view and HORUS's camera model agree.
  camera_horizontal_fov_deg: 84.0
  # Pose mode: horus-gta-bridge's gimbal starts here. --json-physics: the camera stays on SITL's
  # temporary servo mount, which rests at -45 deg and is never commanded (sim/scripts/start_gta_sitl.sh).
  default_gimbal_pitch_deg: -45.0
perception:
  # Frames from horus_capture.asi (gta/capture/README.md) in the game on the same host.
  source: gta://127.0.0.1:5610
  # horus_capture serves at most 15 frames/s (its max_hz); read all of them instead of the 5/s
  # default. GTA renders 1280x720 for the camera (gta/horus_mod/README.md "Drone camera size").
  max_fps: 15.0
  # As config/horus_forest.yaml; start --gta does not start the grounder, so the pass is
  # detector-only unless one is running.
  vocabulary:
    - person
    - person lying on the ground
    - person sitting on the ground
  ring_buffer_s: 30.0
commander:
  timeout_s: 900.0
  claude_model: opus
  claude_effort: high
# GTA's road graph, districts and street furniture around the origin, and its ped navmesh's
# footpaths and roads, for find_place/get_area_map (horus/maps). Built once per machine with
# scripts/maps/fetch_gta_map.py and fetch_gta_walkable.py; the server refuses to start without them.
map:
  provider: gta
  data_path: data/maps/gta/map.json
  walkable_path: data/maps/gta/walkable.json
