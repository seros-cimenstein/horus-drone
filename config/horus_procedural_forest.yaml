# Procedurally generated 1.2 km forest worlds. horus_procedural_urban shares the settings
# explained here; the outdoor perception settings are explained in config/horus_forest.yaml.
flight:
  # Startup connect only: SITL's first heartbeat on a 1.2 km world waits for Gazebo to load and
  # render its first sensor frames, which takes well over 30 s at a slow host's real-time factor.
  heartbeat_timeout_s: 180.0
gimbal:
  # Simulated gimbal device; see config/horus.yaml.
  connection: udpin:127.0.0.1:14600
executor:
  # Command TTLs are wall-clock: an 850 m goto at the 8 m/s cruise is 850 / 8 = 106 s of
  # flight, and a host at RTF ~0.35 on the 1.2 km worlds makes that ~304 s of wall time;
  # 360 s covers it plus ~3 s of acceleration at ArduPilot's default WP_ACC (2.5 m/s^2),
  # yaw alignment and the arrival slowdown. A longer leg passes a larger ttl_s.
  command_ttl_s: 360.0
  speed_m_s: 3.0
  # Above the 23 m tree cap + 3 m margin the horizontal speed rises to 8 m/s; below it (or on
  # a leg whose commanded target altitude is lower) the controller flies at 3 m/s.
  cruise_speed_m_s: 8.0
  cruise_min_altitude_m: 26.0
  vertical_speed_m_s: 1.5
  # The generator's transit altitude stays >= cruise_min_altitude_m.
  arrival_tolerance_m: 0.4
  camera_horizontal_fov_deg: 84.0
  default_gimbal_pitch_deg: -45.0
perception:
  vocabulary:
    - person
    - person lying on the ground
    - person sitting on the ground
  ring_buffer_s: 30.0
commander:
  timeout_s: 900.0
  # Branch `chinkmaxxing`: every model in the commander and its crew runs DeepSeek 4.1 Flash at max
  # effort through the opencode gateway (OpenAI-compatible). Needs OPENCODE_API_KEY in the
  # environment and the `commander-openai` extra.
  provider: openai
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY
  model: deepseek-v4.1-flash
  reasoning_effort: max
  extra_headers:
    x-opencode-session: horus-commander
