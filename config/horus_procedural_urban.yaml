# Procedurally generated 1.2 km city worlds; as config/horus_procedural_forest.yaml except the
# cruise gate.
flight:
  heartbeat_timeout_s: 180.0
gimbal:
  # Simulated gimbal device; see config/horus.yaml.
  connection: udpin:127.0.0.1:14600
executor:
  command_ttl_s: 360.0
  speed_m_s: 3.0
  # Above the 34 m building/roof-equipment cap + 4 m margin the horizontal speed rises to
  # 8 m/s; below it (or on a leg whose commanded target altitude is lower) the controller
  # flies at 3 m/s. The generator's transit altitude stays >= 38 m and <= 45 m.
  cruise_speed_m_s: 8.0
  cruise_min_altitude_m: 38.0
  vertical_speed_m_s: 1.5
  arrival_tolerance_m: 0.4
  camera_horizontal_fov_deg: 84.0
  default_gimbal_pitch_deg: -45.0
perception:
  vocabulary:
    - person
    - person lying on the ground
    - person sitting on the ground
  ring_buffer_s: 30.0
commander:
  timeout_s: 900.0
  # Branch `chinkmaxxing`: every model in the commander and its crew runs DeepSeek 4.1 Flash at max
  # thinking through omp (oh-my-pi), using the user's existing omp login and no API key.
  provider: omp
  omp_model: opencode-go/deepseek-v4.1-flash
  omp_thinking: max
