# Outdoor 150 m city map; as config/horus_forest.yaml except the higher altitude ceiling.
executor:
  max_speed_m_s: 3.0
  max_vertical_speed_m_s: 1.5
  max_distance_m: 70.0
  min_altitude_m: 1.0
  max_altitude_m: 48.0
  geofence_polygon_ned:
    - [-65.0, -65.0]
    - [-65.0, 65.0]
    - [65.0, 65.0]
    - [65.0, -65.0]
  arrival_tolerance_m: 0.4
  follow_distance_m: 3.0
  target_height_m: 1.9
  camera_horizontal_fov_deg: 84.0
  default_gimbal_pitch_deg: -45.0
perception:
  vocabulary:
    - person
    - person lying on the ground
    - person sitting on the ground
  ring_buffer_s: 30.0
commander:
  timeout_s: 900.0
  claude_model: opus
  claude_effort: high
