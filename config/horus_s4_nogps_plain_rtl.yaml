# S4 fixture: GPS-free flight (optical flow) with plain RTL landing (perception off, no AprilTag correction).
# Indoor envelope, polygon and propeller masks as config/horus.yaml (explained there).
flight:
  gps_free_mode: true
executor:
  max_altitude_m: 2.2
  geofence_polygon_ned:
    - [-4.0, -5.0]
    - [-4.0, 5.0]
    - [4.0, 5.0]
    - [4.0, 1.4]
    - [8.0, 1.4]
    - [8.0, -1.4]
    - [4.0, -1.4]
    - [4.0, -5.0]
  geofence_margin_m: 1.2
  target_height_m: 1.9
perception:
  enabled: false
  ignore_regions:
    - [0.0, 0.0, 0.22, 0.24]
    - [0.65, 0.0, 1.0, 0.24]
