# Outdoor 150 m forest map. The outdoor profiles (horus_urban, horus_procedural_*) share the
# perception settings explained here.
gimbal:
  # Simulated gimbal device; see config/horus.yaml.
  connection: udpin:127.0.0.1:14600
executor:
  speed_m_s: 3.0
  vertical_speed_m_s: 1.5
  arrival_tolerance_m: 0.4
  camera_horizontal_fov_deg: 84.0
  default_gimbal_pitch_deg: -45.0
perception:
  # Low-rate person pass over the grounder (open_vocab_hz): the prone phrases are what recover
  # lying/sitting people that yolov8n does not propose at all (see README, outdoor profiles). A
  # seed is named after the matched vocabulary term and carries no detector person evidence, so a
  # grounder-only target still needs target_size_m for a range; the pass degrades to
  # detector-only when the grounder is absent.
  vocabulary:
    - person
    - person lying on the ground
    - person sitting on the ground
  ring_buffer_s: 30.0
commander:
  timeout_s: 900.0
  claude_model: opus
  claude_effort: high
