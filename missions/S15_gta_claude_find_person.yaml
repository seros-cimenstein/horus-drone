# S15: the same task as S14 in GTA V (JSON physics, Legion Square, config/horus_gta.yaml), flown
# by a Claude Code commander instead of a fixed step list. The REPL starts `claude -p` with only
# the HORUS MCP server's tools (horus/commander/backends.py) and gives it the operator's request
# below; Claude chooses every tool call. Its stream and the server's tool calls go to
# $HORUS_EVENT_LOG, and the run result (with Claude's final answer) to ../runs.
#
# No `finally` steps: returning home and landing is part of the request, so it has to be Claude's.
# The executor still bounds every command: the inset fence, altitude 6-48 m (the profile's floor,
# above the 4.4 m kiosk and unmapped low objects) and 3 m/s; a hold without MCP calls for 30 s
# returns home and lands on its own.
#
# Run from the laptop with an SSH tunnel to horus-mcp on Koko:
#   ssh -N -L 18000:127.0.0.1:8000 koko &
#   HORUS_MCP_TOKEN=... HORUS_EVENT_LOG=runs/s15/events.jsonl .venv-host/bin/horus \
#     --server-url http://127.0.0.1:18000/mcp --config config/horus_gta.yaml \
#     --mission missions/S15_gta_claude_find_person.yaml
name: S15-gta-claude-find-person
result_dir: ../runs
steps:
  - text: find a person on the plaza, hover near them, then come back and land
