name: S9-forest-find-missing-hiker
steps:
  - text: >-
      Take off vertically over home (NED north=0 m, east=0 m) to 28 m above home, within the forest executor's 1–36 m altitude range. Use 28 m only for the canopy-clear transit segments explicitly listed here. All coordinates are (north_m, east_m) relative to home; altitudes are positive metres above home. The requested 10 m raster over north -35 to 30 m, east -58 to -25 m, at 6 m spacing is unsafe: all 23 straight legs come within 1.5 m of a tree collision after the 0.6 m drone radius, with a worst clearance of -5.89 m. Do not fly that raster. Do not call the scan skill anywhere in this mission. Use only the ordered goto setpoints below in the forest; do not improvise a route or command a waypoint outside the listed trail, clearing rectangle, or 28 m transit segments.
      At 28 m, go to (-7, -10) and descend vertically there to 5 m. At 5 m, follow this exact ordered trail route, issuing a goto and inspecting a frame at every listed point: (-7, -10), (-10.67, -11.5), (-14.33, -13), (-18, -14.5), (-20, -18.17), (-22, -21.83), (-24, -25.5), (-26.67, -28.83), (-29.33, -32.17), (-32, -35.5), (-34.33, -39.17), (-36.67, -42.83), (-39, -46.5), (-36.67, -42.83), (-34.33, -39.17), (-32, -35.5), (-29.33, -32.17), (-26.67, -28.83), (-24, -25.5), (-22, -21.83), (-20, -18.17), (-18, -14.5), (-14.33, -13), (-10.67, -11.5), (-7, -10). Adjacent setpoints are no more than 5.8 m apart. From (-18, -14.5) onward this follows a line 1.5 m east of the trail centerline. Static collision clearance along this trail route is at least 1.94 m after the 0.6 m drone radius; moving civilians are not covered by that check. If a person or obstacle enters the flight-clearance corridor, stop and hold rather than going around via an unlisted waypoint.
      At the final (-7, -10) trail point, climb vertically to 28 m, transit at 28 m to the forest clearing at (31, -7), and descend vertically to 8 m. Search only inside the open rectangle north 26 to 36 m, east -12 to -2 m, using goto setpoints and inspecting a frame at every point in exactly this order: (31, -7), (28.5, -9.5), (26, -12), (26, -8), (26, -4), (26, -2), (30, -2), (30, -6), (30, -10), (30, -12), (34, -12), (34, -8), (34, -4), (34, -2), (36, -2), (36, -6), (36, -10), (36, -12), (34.75, -10.75), (33.5, -9.5), (31, -7). Adjacent setpoints are no more than 4 m apart and remain inside the rectangle. Do not invoke scan or add any other clearing waypoint.
      At the final clearing point (31, -7), climb vertically to 28 m and transit at 28 m to the off-trail vantage (26.82, -34.69); descend vertically there to 5 m. The listed 28 m home-to-trail, trail-to-clearing, and clearing-to-vantage transit segments have static collision clearances of at least 7.30 m, 7.30 m, and 8.29 m, respectively, after the 0.6 m drone radius. Face heading 227 degrees toward the missing hiker near NED (20, -42), and adjust the camera to about -23 degrees to centre the ground target. This vantage is 10.0 m horizontally from the hiker; keep at least 8 m standoff, do not cross the canopy, and do not fly over or land near the person. The final 640x480 frame shows the lying body partly under canopy near image centre, but YOLO's only person-class box is a low-confidence left-edge candidate, not the hiker; do not use it as the target or invent a tracker ID. Report a live tracker ID only if a later validated hiker track appears; otherwise report that none is available, with the visible evidence, approximate NED position, and uncertainty. Return home using RTL and land, keeping every commanded position inside the forest geofence and altitude envelope.
